name: Build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (debug = GoFile + Manifest-Artefakt, test/release = + GitHub release)'
        type: choice
        options:
          - debug
          - test
          - release
        default: debug

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        target: [y2slte, y2s]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Free disk space (1/3)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a

      - name: Free disk space (2/3)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true

      - name: Free disk space (3/3)
        uses: rokibhasansagar/slimhub_actions@main
        with:
          retain: 'compiler_cmake'

      - name: Set up build environment
        run: |
          sudo apt update
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            attr ccache clang ffmpeg libbrotli-dev libbz2-dev \
            libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
            libzstd-dev linux-modules-extra-$(uname -r) lld protobuf-compiler webp \
            build-essential g++-aarch64-linux-gnu gcc-aarch64-linux-gnu \
            python-is-python3 python3 wget curl

          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source "$HOME/.cargo/env"

          rustc --version
          cargo --version

          wget https://raw.githubusercontent.com/kdrag0n/kramflash/refs/heads/master/mkbootimg.py && sudo ln -sf $(pwd)/mkbootimg.py /usr/bin/mkbootimg && chmod +x /usr/bin/mkbootimg

          sudo modprobe erofs f2fs

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo -n "${{ secrets.PLATFORM_KEY_PK8 }}" | base64 --decode > security/unica_platform.pk8
          echo -n "${{ secrets.PLATFORM_KEY_PEM }}" | base64 --decode > security/unica_platform.x509.pem

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Build dependencies
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/build_dependencies.sh

      - name: Download stock firmwares
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 60
          max_attempts: 3
          retry_on: error
          command: source ./buildenv.sh ${{ matrix.target }} && ./scripts/download_fw.sh

      - name: Extract stock firmwares
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/extract_fw.sh

      - name: Add swap space
        run: |
          SWAP_FILE=$(swapon --show=NAME | tail -n 1)

          if [ -n "$SWAP_FILE" ]; then
            echo "Existing swap found: $SWAP_FILE"
            sudo swapoff "$SWAP_FILE"
            sudo rm -f "$SWAP_FILE"
          else
            SWAP_FILE="/swapfile"
            echo "No existing swap found. Creating $SWAP_FILE"
          fi

          sudo fallocate -l 12G "$SWAP_FILE"
          sudo chmod 600 "$SWAP_FILE"
          sudo mkswap "$SWAP_FILE"
          sudo swapon "$SWAP_FILE"

          echo "Swap configured:"
          free -h
          swapon --show

      - name: Build ROM
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/make_rom.sh

      - name: Upload to GoFile (+ GitHub Release)
        if: github.event_name == 'workflow_dispatch'
        env:
          GOFILE_TOKEN: ${{ secrets.GOFILE_TOKEN }}
          GOFILE_FOLDER_ID: ${{ secrets.GOFILE_FOLDER_ID }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPO: ${{ github.repository }}
          BUILD_TYPE: ${{ github.event.inputs.build_type }}
        run: |
          mkdir -p split_tmp

          for file in out/*.zip; do
            if [ ! -f "$file" ]; then
              echo "No ZIP files found to upload."
              continue
            fi

            FILE_NAME=$(basename "$file")
            FILE_MD5=$(md5sum "$file" | awk '{print $1}')
            VERSION=$(echo "$FILE_NAME" | grep -oP '\d+\.\d+\.\d+' | head -n 1)
            if [ -z "$VERSION" ]; then
              VERSION="0.0.${{ github.run_number }}"
              echo "WARNING: Keine Version im Dateinamen gefunden, nutze $VERSION"
            fi
            BUILD_DATE=$(date +%Y-%m-%d)

            # Always upload to GoFile
            echo "Uploading $FILE_NAME to GoFile..."
            RESPONSE=$(curl -s -F "file=@$file" -F "token=$GOFILE_TOKEN" -F "folderId=$GOFILE_FOLDER_ID" "https://upload-eu-par.gofile.io/uploadFile")
            GOFILE_URL=$(echo "$RESPONSE" | jq -r '.data.downloadPage')
            echo "GoFile Download-Seite: $GOFILE_URL"
            echo "MD5: $FILE_MD5"
            echo "SHA256: $(sha256sum "$file" | awk '{print $1}')"

            # Direkten Download-Link abfragen (klappt nur, wenn das GoFile-Konto es unterstuetzt)
            FOLDER_JSON=$(curl -s -H "Authorization: Bearer $GOFILE_TOKEN" "https://api.gofile.io/contents/$GOFILE_FOLDER_ID" || true)
            DIRECT_URL=""
            if echo "$FOLDER_JSON" | jq -e . > /dev/null 2>&1; then
              echo "GoFile API Status: $(echo "$FOLDER_JSON" | jq -r '.status // "unbekannt"')"
              DIRECT_URL=$(echo "$FOLDER_JSON" | jq -r --arg n "$FILE_NAME" '[.data.children[]? | select(.name == $n) | .link][0] // empty' || true)
            else
              echo "GoFile API hat kein JSON geliefert. Anfang der Antwort: $(echo "$FOLDER_JSON" | head -c 150)"
            fi
            if [ -n "$DIRECT_URL" ]; then
              echo "Direktlink gefunden: $DIRECT_URL"
              echo "$DIRECT_URL" > "$GITHUB_WORKSPACE/gofile_url.txt"
            else
              echo "WARNUNG: Kein Direktlink gefunden, nutze die Download-Seite."
              echo "$GOFILE_URL" > "$GITHUB_WORKSPACE/gofile_url.txt"
            fi

            # Split + GitHub Release for release + test
            if [ "$BUILD_TYPE" = "release" ] || [ "$BUILD_TYPE" = "test" ]; then
              echo "Splitting $FILE_NAME into 6 parts..."
              rm -f split_tmp/*
              cd split_tmp
              split -d -n 6 "../$file" "${FILE_NAME}.part_"
              cd ..

              TAG_NAME="v$VERSION-${{ matrix.target }}-${{ github.run_number }}"
              RELEASE_NAME="${VERSION}-${{ matrix.target }}-${BUILD_DATE}"

              echo "Creating GitHub Release: $RELEASE_NAME"

              RELEASE_DATA=$(jq -n \
                --arg tag "$TAG_NAME" \
                --arg name "$RELEASE_NAME" \
                --arg sha "${{ github.sha }}" \
                --arg body "Komplette ZIP: $(cat "$GITHUB_WORKSPACE/gofile_url.txt")" \
                '{ tag_name: $tag, target_commitish: $sha, name: $name, body: $body, draft: false, prerelease: false }')

              RELEASE_RESPONSE=$(curl -s -X POST \
                -H "Authorization: token $GH_TOKEN" \
                -H "Content-Type: application/json" \
                -d "$RELEASE_DATA" \
                https://api.github.com/repos/$RELEASE_REPO/releases)

              RELEASE_ID=$(echo "$RELEASE_RESPONSE" | jq -r '.id')
              if [ "$RELEASE_ID" = "null" ]; then
                echo "ERROR: Release not created. Antwort von GitHub:"
                echo "$RELEASE_RESPONSE"
                exit 1
              fi
              echo "Release created: $RELEASE_ID"

              for part in split_tmp/*; do
                PART_NAME=$(basename "$part")
                curl -s -X POST \
                  -H "Authorization: token $GH_TOKEN" \
                  -H "Content-Type: application/octet-stream" \
                  --data-binary @"$part" \
                  "https://uploads.github.com/repos/$RELEASE_REPO/releases/$RELEASE_ID/assets?name=$PART_NAME" > /dev/null
              done
            fi
          done

      - name: Generate OTA manifest
        if: github.event_name == 'workflow_dispatch'
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/generate_ota_manifest.sh out
          URL=$(cat "$GITHUB_WORKSPACE/gofile_url.txt")
          sed -i "s|INSERTURLHERE|$URL|" manifest.json
          echo "---- manifest.json ----"
          cat manifest.json

      - name: Save manifest as artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: manifest-${{ matrix.target }}
          path: manifest.json
